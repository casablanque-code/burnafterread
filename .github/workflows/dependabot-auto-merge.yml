name: Dependabot Auto-Merge

on: pull_request

permissions:
  pull-requests: write
  contents: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: dependabot.user.login == 'dependabot[bot]'
    
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
      
      # Auto-merge only for patch updates AND if CI passes
      - name: Auto-merge patch updates (if CI passes)
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-patch'
        run: |
          # Wait for CI checks to complete
          gh pr checks "${{ github.event.pull_request.number }}" --watch --interval 10 --timeout 5m || true
          
          # Get the latest status
          STATUS=$(gh pr checks "${{ github.event.pull_request.number }}" --json status --jq '.[0].status')
          
          if [ "$STATUS" = "PASS" ]; then
            echo "✅ CI passed! Auto-merging patch update..."
            gh pr merge --auto --squash "${{ github.event.pull_request.number }}"
          else
            echo "❌ CI failed. Skipping auto-merge for safety."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      # Approve patch updates (only if we're auto-merging)
      - name: Approve patch updates
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-patch'
        run: |
          gh pr review --approve "${{ github.event.pull_request.number }}" -b "Auto-approved by dependabot workflow"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      # For major/minor updates: add a label and comment to review manually
      - name: Flag major/minor updates for manual review
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-major' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --body "⚠️ This is a **${{ steps.metadata.outputs.update-type }}** update. Please review manually before merging."
          gh pr label add "${{ github.event.pull_request.number }}" --label "dependencies,manual-review-required"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
