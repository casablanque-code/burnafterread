version: 2

updates:
  # Root app: Vite + Cloudflare Worker
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"

    groups:
      production-patch:
        dependency-type: "production"
        update-types:
          - "patch"

      development-patch:
        dependency-type: "development"
        update-types:
          - "patch"

    ignore:
      # TypeScript 6/7 are not currently compatible with the pinned
      # typescript-eslint version.
      - dependency-name: "typescript"
        versions:
          - ">=6.0.0"

    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # /cli - the "burnafter" CLI published separately to npm
  - package-ecosystem: "npm"
    directory: "/cli"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"

    groups:
      production-patch:
        dependency-type: "production"
        update-types:
          - "patch"

      development-patch:
        dependency-type: "development"
        update-types:
          - "patch"

    commit-message:
      prefix: "chore(deps-cli)"
      include: "scope"

  # GitHub Actions used in CI
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
    open-pull-requests-limit: 3
